<div class="container"> 
  <ejs-grid [dataSource]='data' [allowPaging]='true' [pageSettings]='pageSettings' [allowSorting]='true'
    [allowFiltering]='true' [filterSettings]='filterOptions' [editSettings]='editSettings' [toolbar]='toolbar'
    enableAdaptiveUI='true' rowRendringMode="Vertical">
    <e-columns>
      <e-column field='OrderID' headerText='Order ID' textAlign='left' width=90 isPrimaryKey='true'></e-column>
      <e-column field='EmployeeID' headerText='Employee ID' textAlign='left' width=70></e-column>
      <e-column field='CustomerID' headerText='Customer ID' width=120></e-column>
      <e-column field='Freight' headerText='Freight' textAlign='left' format='C2' width=90></e-column>
      <e-column field='OrderDate' headerText='Order Date' textAlign='left' format='yMd' width=120></e-column>
      <e-column field='ShipCountry' headerText='Ship Country' width=120></e-column>
    </e-columns>
  </ejs-grid>
</div>
